version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    # limTOD needs no pre-install step: it is a hard dependency of rheplicant
    # and it is on PyPI, so `pip install .` resolves it. This used to be a
    # `- requirements: docs/requirements.txt` line pinning limTOD at git @main,
    # which meant the docs built against a moving tip and could break with no
    # commit in this repo.
    - method: pip
      path: .
      extra_requirements:
        - docs
        - numpyro
