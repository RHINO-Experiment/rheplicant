name: Tests

# Why this file exists, in one measurement.
#
# Every quality claim in this repository rests on its guards actually running,
# and on 2026-08-24 the README's own test-count guard was found RED on `main`
# -- 10153 claimed, 10174 collected -- after two full-scale code reviews had
# quoted the stale figure as current. Neither reviewer ran the suite. The guard
# was not weak; it simply had nobody to fail in front of.
#
# `tests/radio/test_placeholder_census.py` documents the same failure one level
# down: a machine missing two optional packages collected fewer tests of the
# same suite for weeks, and three real failures sat behind the modules that no
# longer collected. A skipping guard is not a passing one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Create the environment
        # `uv venv` plus `uv pip install`, never `uv sync`: rhino-cal-jax is not
        # on any index, so no lockfile exists or can be made (README, and
        # docs/install.md say why `uv lock` cannot succeed here).
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[rhino,numpyro,gui]" --group dev

      - name: Install the integrations that are not on an index
        # `editables` is not decoration: rhino-cal-jax's editable hook needs it.
        # The branch is not decoration either -- rhino_cal_jax/ lives only on
        # feat/rhino-cal-jax, and the default branch has no pyproject.toml at
        # all, so a URL without the ref installs nothing and fails at the build
        # backend. Both are recorded in this repo's pyproject.toml.
        continue-on-error: true
        id: integrations
        run: |
          uv pip install editables
          uv pip install "rhino-cal-jax @ git+https://github.com/RHINO-Experiment/rhino-cal@feat/rhino-cal-jax"
          uv pip install "MomentRFI @ git+https://github.com/zzhang0123/MomentRFI"

      # The two TypeScript typecheck guards shell out to `node_modules/.bin/tsc`
      # and raised FileNotFoundError without it -- not a skip, a crash, which
      # reads as a broken test rather than a missing toolchain. The frontend is
      # part of this project (CLAUDE.md: the e2e suite serves the checked-in
      # production bundle), so the toolchain belongs in CI rather than the
      # guards being taught to stand down.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/config_gui_spike/react/package-lock.json

      - name: Install the frontend toolchain
        working-directory: tools/config_gui_spike/react
        run: npm ci

      - name: Report environment completeness BEFORE judging any number
        # The difference between what this environment collects and what the
        # README claims IS the completeness report -- that is the design of
        # tests/test_readme_counts.py, which SKIPS (loudly) rather than opining
        # when a module fails to collect. Printed, never asserted on here: a
        # public runner cannot hold the RHEPLICANT_RHINO_* datasets, so its
        # count is legitimately lower and must not be written into the README.
        run: |
          .venv/bin/python -c "
          import importlib
          for name in ('h5py', 'rhino_cal_jax', 'limtod_jax', 'numpyro', 'MomentRFI'):
              try:
                  importlib.import_module(name)
                  print(f'{name:16s} present')
              except Exception as error:
                  print(f'{name:16s} ABSENT  ({type(error).__name__})')
          "
          .venv/bin/python -m pytest --collect-only -q --no-cov 2>/dev/null \
            | awk -F': ' '/^tests\/.*: [0-9]+$/ {n += $2} END {print "collected:", n}'
          grep -oE '\([0-9]+ tests, [0-9.]+ % coverage' README.md || true

      - name: Run the suite
        # Judged by pytest's own exit code. A pipe would report the exit status
        # of the last command in it, which is how a collection error or a usage
        # error reads as green.
        run: .venv/bin/python -m pytest -n auto

  coverage:
    name: Coverage (serial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Create the environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[rhino,numpyro,gui]" --group dev

      - name: Install the integrations that are not on an index
        continue-on-error: true
        run: |
          uv pip install editables
          uv pip install "rhino-cal-jax @ git+https://github.com/RHINO-Experiment/rhino-cal@feat/rhino-cal-jax"
          uv pip install "MomentRFI @ git+https://github.com/zzhang0123/MomentRFI"

      - name: Measure coverage serially
        # SERIAL on purpose, and this job exists for that one word.
        #
        # The reason recorded here was a six-point gap between the runners --
        # `-n 8` at 88.32 % against `-p no:xdist` at 82.26 %, concentrated in
        # the bootstrap modules -- with the cause "NOT established". **It is
        # established and fixed** (8307ff1): two tests installed a
        # `sys.settrace` probe and handed back `None`, which uninstalls
        # coverage's own CTracer for the rest of that thread's session. Serially
        # that blacked out 1982 consecutive tests; under `-n 8` it cost only the
        # one worker that drew them, which is why the PARALLEL figure was the
        # closer of the two. `tests/test_coverage_instrument.py` refuses the
        # shape now, and the runners agree at 89.22 % either way, one statement
        # apart.
        #
        # Re-measured by restoring the pre-fix shape on today's tree and running
        # `-n 8` with coverage: 3533 missed against 3272, a 261-statement loss
        # in exactly three files -- `_rheplicant_bootstrap/plugins.py` (+158),
        # `layering.py` (+101), `frozen.py` (+2). One worker's remainder, and
        # nothing else.
        #
        # THE INTERMITTENT WORKER DROPOUT IS A DIFFERENT FAULT, and that is now
        # measured rather than asserted. The one on record (PROPOSAL_MERGED.md
        # A0.3) lost 893 statements across 51 files, clustered on
        # `config/products/*`, `gui_worker` and `gui_limits`. The settrace
        # signature above is 261 statements across 3 files, all bootstrap. Same
        # mechanism class -- one worker's contribution -- different worker and a
        # disjoint file set.
        #
        # THIRTY `-n 8` coverage runs on this tree did not reproduce it: 3272
        # of 30350 missed on every one, and not one file's missed-count
        # differed in any run, across ~600 files. Zero events in 30 puts a 95 %
        # one-sided upper bound of 9.5 % on the rate, so the recorded
        # one-run-in-ten is excluded at that confidence. It does NOT exclude a
        # lower rate: 5 % would still show zero in 30 runs 21 % of the time.
        #
        # The settrace signature above was re-measured FOUR times and is
        # deterministic -- the same 261 statements in the same three files
        # every run. That is what makes comparing signatures valid: the
        # scheduling worry (that xdist might scatter the loss differently each
        # run, so one sample could not tell the two faults apart) was tested
        # and does not hold here. Both the healthy case and the injected-fault
        # case are exactly reproducible on this machine.
        #
        # Which is what leaves the recorded event genuinely anomalous: 893
        # statements across 51 files is not a scheduling variant of 261 across
        # 3, and nothing in 34 runs reproduces either the size or the file set.
        #
        # What has changed is the consequence. The floor was 85 against a true
        # 88.3 when A0.3 was written -- three points of slack, which is what let
        # a 893-statement loss pass as a green run. It is 89 against a measured
        # 89.22 now, and the settrace mutant above FAILED the gate:
        # "Required test coverage of 89.0% not reached. Total coverage: 88.36%".
        # A recurrence of either fault now fails CI instead of being reported as
        # a pass, which is the property that matters while the cause is open.
        #
        # This job stays serial anyway. The reason is now the smaller one and it
        # stands on its own: one invocation, with no worker count in it, is what
        # the quoted figure should come from. The floor is
        # [tool.coverage.report] fail_under in pyproject.toml -- one number, read
        # by this job, by coverage, and by tests/test_readme_counts.py.
        #
        # It is slow (~21 minutes locally against ~5). That is the price of a
        # number that means the same thing twice.
        run: |
          .venv/bin/python -m pytest -p no:xdist \
            --cov=rheplicant --cov=_rheplicant_bootstrap --cov-report=term
