[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rheplicant"
version = "0.1.4"
description = "RHEPLICANT — a differentiable replica of a radio antenna (RHino + REPLICa + ANTenna): a JAX + Equinox scientific pipeline framework for single-antenna radio telescopes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Zheng Zhang" },
    { name = "Phil Bull" },
    { name = "Jordan Norris" },
    { name = "Rashi Srivastava" },
]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.5",
    "equinox>=0.13",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
numpyro = ["numpyro"]
docs = [
    "sphinx>=7",
    "myst-parser",
    "furo",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxcontrib-mermaid",
]

[project.urls]
Homepage = "https://github.com/RHINO-Experiment/rheplicant"
Documentation = "https://rheplicant.readthedocs.io"
Repository = "https://github.com/RHINO-Experiment/rheplicant"
Changelog = "https://github.com/RHINO-Experiment/rheplicant/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rheplicant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E741: single-character names (l, I, O) are standard physics notation
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=rheplicant --cov-fail-under=80"

[tool.coverage.run]
source = ["rheplicant"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
]
