[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rheplicant"
version = "0.2.0"
description = "RHEPLICANT — a differentiable replica of a radio antenna (RHino + REPLICa + ANTenna): a JAX + Equinox scientific pipeline framework for single-antenna radio telescopes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Zheng Zhang" },
    { name = "Phil Bull" },
    { name = "Jordan Norris" },
    { name = "Rashi Srivastava" },
]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.5",
    "equinox>=0.13",
    "PyYAML>=6.0",
    # The sky engines (GeneralPointingProjector, DriftScanProjector) and the beam
    # adapters are wired to limTOD, and they are the package's real forward model
    # rather than an accessory, so this is a dependency and not an extra.
    #
    # limTOD 1.10.0 is on PyPI, so this resolves normally and `pip install
    # rheplicant` needs no preparatory step. It did not always: the index
    # carried <=1.8.0 against this >=1.10 floor, and the floor was kept anyway,
    # as a refusal to pretend the sky engines are optional. That bet is now paid
    # off rather than merely defensible.
    #
    # `uv sync` still refuses, but no longer over this: the remaining
    # unsatisfiable requirement is `rheplicant[cal]` -> rhino-cal-jax. Measured.
    #
    # Floored at 1.10, which is where the CST reader lives (limTOD.cstbeam); 1.9
    # brought the horizon partition. Beam physics and beam ingestion are both
    # limTOD's subject and this package only places the result on a signal path
    # (D20, D25).
    #
    # The floor is for a resolver; the RUNTIME gates check the symbol, not the
    # version, and that is not redundancy. An editable install reports whatever
    # version its dist metadata was written with, which goes stale the moment the
    # source moves ahead of the last `pip install -e` -- this very repo's venv sat
    # at a recorded 1.8.0 while running 1.10.0 source. A version check would have
    # refused a fully capable install; the symbol check cannot. The gates stay.
    "limTOD[jax]>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
numpyro = ["numpyro"]
# NoiseWaveOperator is an adapter over rhino_cal_jax, the JAX implementation of
# the noise-wave receiver model (D15). The physics has a life outside this
# framework, so the dependency runs one way and stays optional: everything
# except the noise-wave stage works without it, and the operator raises an
# actionable ImportError naming this extra when it is missing.
#
# rhino-cal-jax is not on PyPI, so the extra NAMES the requirement rather than
# resolving it -- and it is the one requirement that still makes a bare
# `uv sync` unsatisfiable:
#   uv pip install -e <path-to-rhino-cal>
#   uv pip install "rhino-cal-jax @ git+https://github.com/RHINO-Experiment/rhino-cal@feat/rhino-cal-jax"
# The branch is not decoration. `rhino_cal_jax/` lives only on
# `feat/rhino-cal-jax`; the repository's default branch carries the numpy
# pipeline and no `pyproject.toml` at all, so the URL without a ref installs
# nothing and fails at the build backend.
cal = ["rhino-cal-jax"]
# MomentRFIFlaggingOperator bridges to the numpy MomentRFI package through
# jax.pure_callback. MomentRFI is not on PyPI, so this extra names the
# requirement rather than resolving it:
#   uv pip install -e <path-to-MomentRFI>
#   uv pip install "MomentRFI @ git+https://github.com/zzhang0123/MomentRFI"
# The threshold-based FlaggingOperator needs none of it.
rfi = ["MomentRFI", "MomentEmu"]
# read_rhino_observation() reads the RHINO observation HDF5 through h5py. Unlike
# rhino-cal-jax and MomentRFI this one IS on PyPI, so the extra resolves
# normally:
#   uv pip install -e ".[rhino]"
# The Touchstone reader needs none of it -- it is numpy only.
rhino = ["h5py"]
# resources.beams format: uvbeam reads a pyuvdata UVBeam file and samples it
# through limTOD's own bridge (limTOD.uvbeam) -- the bridge ships with limTOD,
# so only the file reader is optional. pyuvdata is on PyPI and needs
# Python >= 3.11, the floor this package already declares:
#   uv pip install -e ".[uvbeam]"
uvbeam = ["pyuvdata>=3.0"]
docs = [
    "sphinx>=7",
    "myst-parser",
    "furo",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxcontrib-mermaid",
]

[project.urls]
Homepage = "https://github.com/RHINO-Experiment/rheplicant"
Documentation = "https://rheplicant.readthedocs.io"
Repository = "https://github.com/RHINO-Experiment/rheplicant"
Changelog = "https://rheplicant.readthedocs.io/en/latest/changelog.html"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "jsonschema>=4.23",
    # tests/test_docs_links.py checks every `](page.md#anchor)` against the
    # anchors myst would generate, and imports myst's own slugifier to do it
    # rather than inventing a third scheme that agrees with neither. That
    # slugifier otherwise arrives only with myst-parser, in the `docs` extra,
    # which the dev group does not install -- so without this line the guard
    # cannot run at all, and every one of its cases fails claiming the
    # destination page "has no such anchor". Measured 2026-08-09: 31 of 31
    # failing, zero links actually broken.
    "mdit-py-plugins",
    # Eighteen module-level `import numpyro` across five test modules, none of
    # them guarded by `importorskip` -- unlike `rhino_cal_jax`, which is guarded
    # because it cannot come from an index at all. numpyro can, so the suite is
    # meant to exercise the gradient posteriors rather than skip past them.
    # A runtime *extra* for users and a hard requirement for the tests is exactly
    # what a dev group is for: without it `pytest` stops at collection with five
    # ImportErrors, and the install page's own "run the suite" command cannot
    # run. Measured 2026-08-09.
    "numpyro",
    # The suite is not slow because it is large. Measured 2026-08-09: the four
    # heaviest items account for 249 s of a 692 s serial run, while the other
    # ~2700 tests together come to about 290 s -- a tenth of a second each. So
    # deleting tests buys almost nothing and costs coverage, and parallelism
    # buys everything: `-n 8` runs the same 2286 passed / 486 skipped in 241 s.
    # The floor is the float64 subsession, 159 s that one worker must carry
    # alone.
    "pytest-xdist",
]

[tool.uv.sources]
rhino-cal-jax = { git = "https://github.com/RHINO-Experiment/rhino-cal", branch = "feat/rhino-cal-jax" }
MomentRFI = { git = "https://github.com/zzhang0123/MomentRFI" }
MomentEmu = { git = "https://github.com/zzhang0123/MomentEmu" }

[tool.hatch.build.targets.wheel]
packages = ["src/rheplicant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E741: single-character names (l, I, O) are standard physics notation
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=rheplicant --cov-fail-under=80"

[tool.coverage.run]
source = ["rheplicant"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
]
