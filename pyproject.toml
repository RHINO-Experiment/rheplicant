[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rheplicant"
version = "0.1.4"
description = "RHEPLICANT — a differentiable replica of a radio antenna (RHino + REPLICa + ANTenna): a JAX + Equinox scientific pipeline framework for single-antenna radio telescopes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Zheng Zhang" },
    { name = "Phil Bull" },
    { name = "Jordan Norris" },
    { name = "Rashi Srivastava" },
]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.5",
    "equinox>=0.13",
    # The sky engines (GeneralPointingProjector, DriftScanProjector) and the beam
    # adapters are wired to limTOD, and they are the package's real forward model
    # rather than an accessory, so this is a dependency and not an extra.
    #
    # THE COST, STATED: limTOD is not on PyPI at this floor -- the index carries
    # <=1.8.0 -- so a plain `pip install rheplicant` cannot resolve, and neither
    # can `uv sync` / `uv run` (both measured: "your project's requirements are
    # unsatisfiable"). Install limTOD first, or work against the lock with
    # `uv sync --frozen` / `uv run --frozen`. Publishing to PyPI needs limTOD
    # published first; until then this floor is a deliberate refusal to pretend
    # the sky engines are optional.
    #
    # Floored at 1.10, which is where the CST reader lives (limTOD.cstbeam); 1.9
    # brought the horizon partition. Beam physics and beam ingestion are both
    # limTOD's subject and this package only places the result on a signal path
    # (D20, D25).
    #
    # The floor is for a resolver; the RUNTIME gates check the symbol, not the
    # version, and that is not redundancy. An editable install reports whatever
    # version its dist metadata was written with, which goes stale the moment the
    # source moves ahead of the last `pip install -e` -- this very repo's venv sat
    # at a recorded 1.8.0 while running 1.10.0 source. A version check would have
    # refused a fully capable install; the symbol check cannot. The gates stay.
    "limTOD[jax]>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
numpyro = ["numpyro"]
# NoiseWaveOperator is an adapter over rhino_cal_jax, the JAX implementation of
# the Noise-Wave GCR note's Eq. 1 (D15). The physics has a life outside this
# framework, so the dependency runs one way and stays optional: everything
# except the noise-wave stage works without it, and the operator raises an
# actionable ImportError naming this extra when it is missing.
#
# Like limTOD and MomentRFI, rhino-cal-jax is not on PyPI, so the extra NAMES
# the requirement rather than resolving it:
#   uv pip install -e <path-to-rhino-cal>
#   uv pip install "rhino-cal-jax @ git+https://github.com/RHINO-Experiment/rhino-cal"
cal = ["rhino-cal-jax"]
# MomentRFIFlaggingOperator bridges to the numpy MomentRFI package through
# jax.pure_callback. Like limTOD above, MomentRFI is not on PyPI, so this extra
# names the requirement rather than resolving it:
#   uv pip install -e <path-to-MomentRFI>
#   uv pip install "MomentRFI @ git+https://github.com/zzhang0123/MomentRFI"
# The threshold-based FlaggingOperator needs none of it.
rfi = ["MomentRFI"]
# read_rhino_observation() reads the RHINO observation HDF5 through h5py. Unlike
# limTOD and MomentRFI this one IS on PyPI, so the extra resolves normally:
#   uv pip install -e ".[rhino]"
# The Touchstone reader needs none of it -- it is numpy only.
rhino = ["h5py"]
docs = [
    "sphinx>=7",
    "myst-parser",
    "furo",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinxcontrib-mermaid",
]

[project.urls]
Homepage = "https://github.com/RHINO-Experiment/rheplicant"
Documentation = "https://rheplicant.readthedocs.io"
Repository = "https://github.com/RHINO-Experiment/rheplicant"
Changelog = "https://github.com/RHINO-Experiment/rheplicant/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rheplicant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E741: single-character names (l, I, O) are standard physics notation
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=rheplicant --cov-fail-under=80"

[tool.coverage.run]
source = ["rheplicant"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
]
